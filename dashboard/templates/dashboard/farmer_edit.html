{% extends "base.html" %}
{% load i18n %}

{% block title %}
    {% trans "Edit Farmer" %} | ShetiMitra
{% endblock %}

{% block content %}

<div class="form-container">

    <div class="page-header">
        <h1>✏️ {% trans "Edit Farmer" %}</h1>
        <p>{% trans "Update farmer details." %}</p>
    </div>

    <form method="POST" class="farmer-form">

        {% csrf_token %}

        <div class="form-group">

            <label for="name">
                {% trans "Farmer Name" %}
            </label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ farmer.name }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="mobile">
                {% trans "Mobile" %}
            </label>

            <input
                type="text"
                id="mobile"
                name="mobile"
                value="{{ farmer.mobile }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="village">
                {% trans "Village" %}
            </label>

            <input
                type="text"
                id="village"
                name="village"
                value="{{ farmer.village }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="taluka">
                {% trans "Taluka" %}
            </label>

            <input
                type="text"
                id="taluka"
                name="taluka"
                value="{{ farmer.taluka }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="district">
                {% trans "District" %}
            </label>

            <input
                type="text"
                id="district"
                name="district"
                value="{{ farmer.district }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="land_area_acres">
                {% trans "Land Area (Acres)" %}
            </label>

            <input
                type="number"
                step="0.01"
                id="land_area_acres"
                name="land_area_acres"
                value="{{ farmer.land_area_acres }}"
                required
            >

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                💾 {% trans "Update Farmer" %}
            </button>


            <a
                href="{% url 'farmer_list' %}"
                class="btn btn-secondary"
            >
                ❌ {% trans "Back to Farmer List" %}
            </a>

        </div>

    </form>

</div>

{% endblock %}
